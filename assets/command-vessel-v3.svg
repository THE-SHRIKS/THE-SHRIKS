<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="title desc">
<title id="title">THE SHRIKS</title><desc id="desc">A pure-black textured pixel-space banner with a floating, detailed original mothership, and the words THE SHRIKS, System Architecture, and Founder Laukik Rajput.</desc>
<style>
  .engine-pulse{animation:thrust 3.8s steps(3,end) infinite}
  .engine-pulse.delayed{animation-delay:1.1s}
  .signal{animation:beacon 7s steps(1,end) infinite}
  .hull-light{animation:hull-glint 8s steps(3,end) infinite}
  .hull-light.b{animation-delay:2.1s}
  @keyframes thrust{0%,100%{opacity:.08;transform:translateX(8px)}40%,60%{opacity:.70;transform:translateX(-7px)}}
  @keyframes beacon{0%,60%,66%,100%{opacity:.10}62%,64%{opacity:.78}}
  @keyframes hull-glint{0%,100%{opacity:.12}48%,54%{opacity:.7}}
  @media (prefers-reduced-motion:reduce){.engine-pulse,.signal,.hull-light{animation:none}}
</style>
<defs><pattern id="pixel-void" width="128" height="128" patternUnits="userSpaceOnUse">
<rect x="0" y="0" width="128" height="128" fill="#050505"/>
<rect x="8" y="16" width="8" height="8" fill="#090909"/>
<rect x="56" y="40" width="16" height="8" fill="#0A0A0A"/>
<rect x="96" y="8" width="8" height="8" fill="#0C0C0C"/>
<rect x="24" y="80" width="8" height="8" fill="#0C0C0C"/>
<rect x="104" y="88" width="16" height="8" fill="#080808"/>
<rect x="72" y="112" width="8" height="8" fill="#0B0B0B"/>
</pattern></defs><rect width="1200" height="370" fill="#050505"/><rect width="1200" height="370" fill="url(#pixel-void)"/>
<path d="M40 36H1160M40 334H1160" stroke="#F5F5F5" stroke-opacity=".24"/>
<path d="M40 36V55H59M1160 36V55H1141M40 334V315H59M1160 334V315H1141" stroke="#F5F5F5" fill="none" stroke-opacity=".22" stroke-width="2"/>
<rect x="744" y="62" width="3" height="3" fill="#F5F5F5" opacity="0.33"/><rect x="920" y="55" width="2" height="2" fill="#F5F5F5" opacity="0.27"/><rect x="1095" y="90" width="3" height="3" fill="#F5F5F5" opacity="0.39"/><rect x="772" y="317" width="2" height="2" fill="#F5F5F5" opacity="0.28"/><rect x="1166" y="292" width="2" height="2" fill="#F5F5F5" opacity="0.25"/><rect x="655" y="95" width="2" height="2" fill="#F5F5F5" opacity="0.24"/>
<path d="M610 72V306" stroke="#242424" stroke-width="2"/>
<g fill="#F5F5F5" font-family="'Inter','Segoe UI',Arial,Helvetica,sans-serif">
<text x="60" y="162" font-size="77" font-weight="750" letter-spacing="-2.6">THE SHRIKS</text>
<text x="63" y="205" font-size="24" font-weight="600" letter-spacing="4.2">SYSTEM ARCHITECTURE</text>
<text x="63" y="285" font-size="19" font-weight="400" letter-spacing=".5">Laukik Rajput <tspan opacity=".47">/</tspan> Founder</text>
</g>
<rect x="63" y="231" width="360" height="2" fill="#F5F5F5" opacity=".32"/>
<rect x="63" y="231" width="56" height="4" fill="#F5F5F5" opacity=".87"><animate attributeName="width" values="56;56;74;56" dur="12s" repeatCount="indefinite"/></rect>
<g id="ship-float">
  <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0; 0 5; 0 0" keyTimes="0;0.28;0.56;0.82;1" dur="11s" repeatCount="indefinite" calcMode="linear"/>
  <g id="ship" shape-rendering="crispEdges">
<!-- Deep hull and armored keel -->
<path d="M696 205H736V189H784V173H832V157H960V165H1040V173H1088V181H1136V197H1176V205H1192V229H1168V245H1136V261H1064V277H960V293H840V285H792V269H752V253H720V237H696Z" fill="#242424"/>
<path d="M712 205H760V189H808V173H856V165H952V173H1032V181H1080V197H1144V213H1176V221H1152V229H1120V245H1056V261H968V277H856V269H800V253H760V237H712Z" fill="#363636"/>
<path d="M736 205H792V189H864V173H952V181H1040V197H1104V213H1152V221H1128V229H1072V245H984V261H872V253H800V237H752V221H736Z" fill="#111111"/>
<!-- original stepped command bridge, flush to body -->
<path d="M872 165V141H888V125H920V117H944V125H960V141H976V173H952V157H920V149H904V165Z" fill="#242424"/>
<path d="M888 141H904V133H944V141H960V149H920V157H888Z" fill="#F5F5F5" opacity=".66"/>
<rect x="928" y="133" width="16" height="8" fill="#050505"/>
<!-- keel stepping and distinct prow -->
<path d="M760 237H864V253H984V261H1056V245H1120V229H1152V237H1128V253H1080V269H984V285H872V277H808V261H760Z" fill="#050505" opacity=".88"/>
<path d="M832 253H944V261H1008V269H952V277H856V269H832Z" fill="#242424"/>
<!-- segmented hull plating -->
<rect x="792" y="198" width="144" height="8" fill="#F5F5F5" opacity=".77"/>
<rect x="952" y="198" width="88" height="8" fill="#F5F5F5" opacity=".47"/>
<rect x="1056" y="205" width="64" height="8" fill="#F5F5F5" opacity=".72"/>
<rect x="768" y="217" width="160" height="8" fill="#F5F5F5" opacity=".56"/>
<rect x="944" y="217" width="120" height="8" fill="#F5F5F5" opacity=".26"/>
<rect x="1080" y="221" width="64" height="8" fill="#F5F5F5" opacity=".48"/>
<path d="M840 181V229M920 173V229M1016 189V245M1088 205V237" stroke="#363636" stroke-width="8"/>
<!-- hangar portals -->
<rect x="840" y="213" width="48" height="24" fill="#050505"/>
<rect x="848" y="213" width="32" height="8" fill="#F5F5F5" opacity=".48"/>
<rect x="856" y="221" width="16" height="8" fill="#171C18"/>
<rect x="968" y="213" width="64" height="24" fill="#050505"/>
<rect x="976" y="221" width="48" height="8" fill="#F5F5F5" opacity=".33"/>
<rect x="1000" y="229" width="16" height="8" fill="#171C18"/>
<rect x="784" y="229" width="40" height="8" fill="#050505"/>
<rect x="1048" y="229" width="32" height="8" fill="#050505"/>
<!-- aft engine banks -->
<path d="M688 205H736V237H688Z" fill="#050505"/>
<rect x="680" y="205" width="48" height="8" fill="#363636"/>
<rect x="672" y="217" width="56" height="8" fill="#363636"/>
<rect x="680" y="229" width="48" height="8" fill="#363636"/>
<rect x="656" y="210" width="16" height="8" fill="#F5F5F5" opacity=".49"/>
<rect x="656" y="225" width="16" height="8" fill="#F5F5F5" opacity=".49"/>
<rect class="engine-pulse" x="632" y="210" width="24" height="8" fill="#D2CFC5" opacity=".12"><animate attributeName="opacity" values=".08;.65;.14;.08" dur="3.8s" repeatCount="indefinite"/></rect>
<rect class="engine-pulse delayed" x="632" y="225" width="24" height="8" fill="#D2CFC5" opacity=".12"><animate attributeName="opacity" values=".12;.52;.08;.12" dur="4.7s" begin="1.1s" repeatCount="indefinite"/></rect>
<!-- tiny windows tracing scale -->
<g fill="#F5F5F5" opacity=".74">
<rect x="816" y="189" width="8" height="4"/><rect x="832" y="189" width="8" height="4"/><rect x="848" y="189" width="8" height="4"/>
<rect x="968" y="189" width="8" height="4"/><rect x="984" y="189" width="8" height="4"/><rect x="1000" y="189" width="8" height="4"/>
<rect x="1048" y="205" width="8" height="4"/>
</g>
<!-- hull signal, quiet blink -->
<rect class="signal" x="1136" y="214" width="8" height="5" fill="#D2CFC5" opacity=".66"><animate attributeName="opacity" values=".12;.12;.74;.12" keyTimes="0;.63;.65;1" dur="7s" repeatCount="indefinite"/></rect>
<path d="M784 285H840M1008 277H1080" stroke="#F5F5F5" stroke-opacity=".19" stroke-width="2"/>
<rect class="hull-light" x="880" y="222" width="8" height="4" fill="#F5F5F5" opacity=".32">
<animate attributeName="opacity" values=".16;.7;.16" dur="7.6s" repeatCount="indefinite"/>
</rect>
<rect class="hull-light b" x="1016" y="223" width="8" height="4" fill="#F5F5F5" opacity=".22">
<animate attributeName="opacity" values=".12;.5;.12" dur="9.2s" begin="2s" repeatCount="indefinite"/>
</rect>
<rect x="947" y="149" width="8" height="4" fill="#F5F5F5" opacity=".13">
<animate attributeName="opacity" values=".13;.38;.13" dur="6.8s" repeatCount="indefinite"/>
</rect></g></g>
</svg>